[project]
name = "ruencod"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tokenizers>=0.23",
  "transformers>=4.45",
  "datasets>=3.0",
  "huggingface_hub",
  "pymorphy3",
  "pymorphy3-dicts-ru",
  "regex",
  "tiktoken",
  "sentencepiece",
  "protobuf",
  "anthropic",
  "numpy",
  "matplotlib",
  "pillow",
  "pandas",
  "pyyaml",
  "zstandard",
  "tqdm",
]

[project.optional-dependencies]
# ровно одно из двух: `uv sync --extra cpu` (без видеокарты) или `uv sync --extra cu126` (NVIDIA)
cpu = ["torch==2.14.1"]
cu126 = ["torch==2.14.1"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruencod"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
